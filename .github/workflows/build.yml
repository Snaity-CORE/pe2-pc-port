# Builds the port on GitHub's runners, from snapshot/ (no game discs: see
# docs/BUILDING.md, "Without the discs"), and tests it. A pushed tag vX.Y.Z
# also packages it and opens a draft release (docs/RELEASING.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # the draft release, on a tag
    steps:
      - uses: actions/checkout@v4
        with:
          # The decomp's sources (not its own submodules: the PSX build is
          # not made here). A private decomp needs a token that can read it.
          submodules: true
          token: ${{ secrets.DECOMP_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: LLVM
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
          $llvm | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$llvm\clang.exe" --version

      - name: Game library (from snapshot/)
        run: |
          python tools/gen_units.py
          python tools/build_game.py

      - name: Host
        run: cargo build --release --target i686-pc-windows-msvc -p pe2-host

      - name: Tests
        run: cargo test --release --target i686-pc-windows-msvc -p pe2-host

      - uses: actions/upload-artifact@v4
        with:
          name: pe2-windows-x86
          path: target/i686-pc-windows-msvc/release/pe2.exe

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py ${{ github.ref_name }} --ci
