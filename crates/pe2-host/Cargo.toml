[package]
name = "pe2-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pe2"
path = "src/main.rs"

[dependencies]
chd = "0.3.4"
cpal = "0.15"
gilrs = "0.11"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
png = "0.17"
softbuffer = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Media", "Win32_Security", "Win32_System_Memory", "Win32_System_LibraryLoader"] }
winit = "0.30"
