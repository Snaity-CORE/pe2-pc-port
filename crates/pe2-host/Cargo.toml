[package]
name = "pe2-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pe2"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
chd = "0.3.4"
claxon = "0.4"
cpal = "0.15"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
gilrs = "0.11"
hound = "3.5"
image-webp = "0.2"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
lewton = "0.10"
mp4 = "0.14"
openh264 = "0.9.9"
png = "0.17"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
toml = "1.1.8"
toml_edit = "0.25.17"
wgpu = "30"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_Media", "Win32_Security", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_SystemInformation"] }
winit = "0.30"

[build-dependencies]
png = "0.17"
