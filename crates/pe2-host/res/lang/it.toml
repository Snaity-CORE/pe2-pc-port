# PE2PC's own screens in Italian: its pause menu (Esc), its Options and the
# few texts it adds to the item boxes. Used when the launcher's language is
# Italian ([general] language = "it"); a mod's translation of the same text
# (strings/pc/*.toml, docs/MODDING.md) wins. Titles are drawn in the menus'
# small face, which has no accents.

