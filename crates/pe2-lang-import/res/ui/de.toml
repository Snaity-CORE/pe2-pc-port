# The window in German: each of its English texts -> its translation.

"Languages for PE2PC" = "Sprachen für PE2PC"
"Makes a PE2PC mod of the dialogue, menus, items, pictures of text, loading captions and movies of your own French, German, Spanish or Italian discs of Parasite Eve II, or of the dialogue and movies of your Japanese discs. Nothing of the game comes with this program: all is read from your discs." = "Erstellt eine PE2PC-Mod mit den Dialogen, Menüs, Gegenständen, Textbildern, Ladetiteln und Videos deiner eigenen französischen, deutschen, spanischen oder italienischen Discs von Parasite Eve II, oder mit den Dialogen und Videos deiner japanischen Discs. Nichts vom Spiel liegt diesem Programm bei: Alles wird von deinen Discs gelesen."
"Not chosen" = "Nicht gewählt"
"Browse..." = "Durchsuchen..."
"CD image" = "CD-Abbild"
"USA disc 1" = "US-Disc 1"
"USA disc 2" = "US-Disc 2"
"Your disc 1" = "Deine Disc 1"
"Your disc 2" = "Deine Disc 2"
"Choose PE2PC's program (pe2.exe): the import reads the discs with it." = "Wähle das Programm von PE2PC (pe2.exe): Der Import liest die Discs damit."
"Make the mod" = "Mod erstellen"
"Reading the USA discs" = "US-Discs werden gelesen"
"Reading your discs" = "Deine Discs werden gelesen"
"Making the mod" = "Mod wird erstellt"
"Converting the movies with text" = "Videos mit Text werden umgewandelt"
"This takes a few minutes. The discs are read into a temporary folder (about 2 GB), removed at the end." = "Das dauert ein paar Minuten. Die Discs werden in einen temporären Ordner gelesen (etwa 2 GB), der am Ende gelöscht wird."
"The mod is made." = "Die Mod ist fertig."
"lines of dialogue" = "Dialogzeilen"
"texts of the menus" = "Menütexte"
"loading captions" = "Ladetitel"
"The movies with text stay in English." = "Die Videos mit Text bleiben auf Englisch."
"Turn on Experimental features (mods) in PE2PC's Settings > General." = "Schalte Experimentelle Funktionen (Mods) in den Einstellungen > Allgemein von PE2PC ein."
"In PE2PC's Mods tab, the mod is on. For PE2PC's own screens in your language too: Settings > General > Language." = "Im Mods-Tab von PE2PC ist die Mod eingeschaltet. Für PE2PCs eigene Bildschirme in deiner Sprache: Einstellungen > Allgemein > Sprache."
"Also on, turn it off in the Mods tab:" = "Ebenfalls eingeschaltet, im Mods-Tab ausschalten:"
"The import failed." = "Der Import ist fehlgeschlagen."
