# The window in Italian: each of its English texts -> its translation.

"Languages for PE2PC" = "Lingue per PE2PC"
"Makes a PE2PC mod of the dialogue, menus, items, pictures of text, loading captions and movies of your own French, German, Spanish or Italian discs of Parasite Eve II, or of the dialogue and movies of your Japanese discs. Nothing of the game comes with this program: all is read from your discs." = "Crea una mod di PE2PC con i dialoghi, i menu, gli oggetti, le immagini di testo, le didascalie di caricamento e i filmati dei tuoi dischi francesi, tedeschi, spagnoli o italiani di Parasite Eve II, o con i dialoghi e i filmati dei tuoi dischi giapponesi. Questo programma non contiene nulla del gioco: tutto viene letto dai tuoi dischi."
"Not chosen" = "Non scelto"
"Browse..." = "Sfoglia..."
"CD image" = "Immagine CD"
"USA disc 1" = "Disco 1 USA"
"USA disc 2" = "Disco 2 USA"
"Your disc 1" = "Il tuo disco 1"
"Your disc 2" = "Il tuo disco 2"
"Choose PE2PC's program (pe2.exe): the import reads the discs with it." = "Scegli il programma di PE2PC (pe2.exe): l'importazione legge i dischi con esso."
"Make the mod" = "Crea la mod"
"Reading the USA discs" = "Lettura dei dischi USA"
"Reading your discs" = "Lettura dei tuoi dischi"
"Making the mod" = "Creazione della mod"
"Converting the movies with text" = "Conversione dei filmati con testo"
"This takes a few minutes. The discs are read into a temporary folder (about 2 GB), removed at the end." = "Ci vuole qualche minuto. I dischi vengono letti in una cartella temporanea (circa 2 GB), eliminata alla fine."
"The mod is made." = "La mod è pronta."
"lines of dialogue" = "righe di dialogo"
"texts of the menus" = "testi dei menu"
"loading captions" = "didascalie di caricamento"
"The movies with text stay in English." = "I filmati con testo restano in inglese."
"Turn on Experimental features (mods) in PE2PC's Settings > General." = "Attiva Funzioni sperimentali (mod) in Impostazioni > Generale di PE2PC."
"In PE2PC's Mods tab, the mod is on. For PE2PC's own screens in your language too: Settings > General > Language." = "Nella scheda Mod di PE2PC, la mod è attiva. Per avere anche le schermate di PE2PC nella tua lingua: Impostazioni > Generale > Lingua."
"Also on, turn it off in the Mods tab:" = "Attiva anche questa, disattivala nella scheda Mod:"
"The import failed." = "L'importazione non è riuscita."
