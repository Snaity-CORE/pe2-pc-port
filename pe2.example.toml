# Settings for pe2. The launcher writes pe2.toml in PE2PC's data folder
# (%APPDATA%\PE2PC on Windows, ~/Library/Application Support/PE2PC on
# macOS, ~/.local/share/pe2pc elsewhere); copy this file there to edit it
# by hand. For a portable setup, put an empty portable.txt next to pe2.exe:
# everything then stays in pe2.exe's folder (as it does when a pe2.toml is
# already there). PE2_HOME names another folder. pe2.toml is not tracked by
# git.
# Command-line arguments and PE2_* environment variables override it.
# Relative paths are relative to the pe2.toml file. Write Windows paths in
# 'single quotes' (backslashes are fine there) or with forward slashes:
# in "double quotes" a backslash starts an escape sequence.

[general]
# The launcher's language: "en" or "pt".
# language = "en"
# Esc asks before quitting (Cancel is the default: Enter or Esc again keep
# playing); false quits at once.
# confirm_exit = true

[discs]
# Your own dumps of Parasite Eve II (USA), .cue or .chd. With these set,
# pe2 starts without arguments.
# disc1 = 'D:\Games\PSX\Parasite Eve II (USA) (Disc 1).chd'
# disc2 = 'D:\Games\PSX\Parasite Eve II (USA) (Disc 2).chd'

[video]
# Internal resolution, a multiple of the console's 320x240: 1 is the
# console's picture (with its dithering); 2-8 render in true colour.
scale = 4
# "hardware" (the graphics card, the default) or "software" (everything on
# the CPU; also used when no graphics adapter works).
# renderer = "hardware"
# Exact vertex positions from the game's 3D projections at scales above 1,
# instead of whole console pixels: no wobbling or gaps between polygons.
# subpixel = true
# Perspective-correct textures and colours on 3D polygons (needs subpixel):
# no more warping of textures on large polygons seen at an angle.
# perspective = true
# Textures of 3D polygons: "nearest" (the console's look) or "bilinear"
# (smoothed; sprites, text and the interface stay sharp).
# texture_filter = "nearest"
# Pre-rendered backgrounds and full-screen pictures at scales above 1:
# "nearest" (blocks of console pixels, as now) or "bicubic" (enlarged
# smoothly; text and the interface stay sharp). Hardware renderer.
# background_filter = "nearest"
# Smooth motion: where the game runs at 30 fps, frames in between at 60,
# with the 3D models halfway (backgrounds and the interface are unchanged).
# No added delay. Needs the hardware renderer and subpixel.
# frame_interpolation = true
# The look of a CRT television: scanlines (the console's 240 lines) and an
# aperture grille. Best with the window at least 720 pixels high.
# crt = false
# Start in borderless full screen (a window without borders covering the
# monitor, no mode change); Alt+Enter toggles it at any time.
# fullscreen = false

[input]
# Player 1's controller: "auto" (the one last used) or its name, as the
# launcher's Controls screen lists it.
# controller = "auto"
# vibration = true
# Movement: "tank" (the original: up walks forward, left and right turn)
# or "modern" (the stick or d-pad points where to go, relative to the
# camera; a full push of the stick runs).
# movement = "tank"
# With tank movement, back + run turns around at once.
# quick_turn = true
# The launcher's Controls screen edits the mappings below. Keys use winit's
# names ("KeyZ", "ArrowUp", "Enter"); controller buttons are by position
# ("South" is A on Xbox and Cross on PlayStation pads). Esc, P, F9-F12 and
# Alt keep their own jobs.
# [input.keyboard]
# cross = "KeyZ"
# [input.gamepad]
# cross = "South"

[memcard]
# Raw 128 KB memory card images (DuckStation's .mcd files work). Default:
# memcards/pe2_card1.mcd and pe2_card2.mcd in the data folder.
# slot1 = "memcards/pe2_card1.mcd"
# slot2 = "memcards/pe2_card2.mcd"
